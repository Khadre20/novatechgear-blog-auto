name: Article de blog quotidien

on:
  schedule:
    - cron: '0 7 * * *' # 7h00 UTC = 9h Paris (été) / 8h Paris (hiver)
  workflow_dispatch: {} # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer et publier l'article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: node scripts/generate-and-publish.mjs

      - name: Sauvegarder l'historique des sujets déjà traités
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/history.json
          git diff --staged --quiet || git commit -m "Historique: nouvel article publié"
          git push
